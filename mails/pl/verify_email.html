<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
      color: #333;
    }
    h2 {
      color: #2c3e50;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      padding: 8px 12px;
      border: 1px solid #ddd;
    }
    th {
      background-color: #eee;
      text-align: left;
    }
    #accept-link-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #3498db;
      color: white !important;
      text-decoration: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Witaj,</h2>

  <p>Oto produkty, które chcesz zweryfikować:</p>

  <table>
    <thead>
      <tr>
        <th>Produkt</th>
        <th>Cena netto za szt.</th>
        <th>Ilość</th>
        <th>Razem netto</th>
      </tr>
    </thead>
    <tbody>
      {product_table_rows}
    </tbody>
  </table>

  <p>Aby potwierdzić weryfikację, kliknij poniższy przycisk:</p>
  <a href="{verify_link}" id="accept-link-button">Potwierdź weryfikację</a>

  <p style="margin-top:30px;">Dziękujemy za zaufanie!</p>

</body>
</html>
